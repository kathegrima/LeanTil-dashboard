<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Chair -->
  <rect x="40" y="190" width="120" height="20" rx="8" fill="none" stroke="#666" stroke-width="4"/>
  <rect x="50" y="170" width="100" height="25" rx="10" fill="none" stroke="#666" stroke-width="4"/>
  
  <!-- Legs -->
  <rect x="55" y="210" width="15" height="30" rx="5" fill="none" stroke="#666" stroke-width="3"/>
  <rect x="130" y="210" width="15" height="30" rx="5" fill="none" stroke="#666" stroke-width="3"/>
  
  <!-- Torso -->
  <rect x="75" y="120" width="50" height="60" rx="12" fill="none" stroke="#333" stroke-width="5"/>
  
  <!-- Left arm (relaxed) -->
  <path d="M 75 135 Q 60 140, 55 160 Q 50 185, 65 190" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Right arm pulling head -->
  <path d="M 125 135 Q 140 130, 150 125 Q 165 120, 170 135 Q 165 155, 155 160" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Hand -->
  <ellipse cx="170" cy="142" rx="10" ry="8" fill="none" stroke="#333" stroke-width="4"/>
  
  <!-- Head (tilted right) -->
  <ellipse cx="105" cy="95" rx="22" ry="25" fill="none" stroke="#333" stroke-width="5"/>
  
  <!-- Neck -->
  <path d="M 105 120 Q 115 125, 125 120" fill="none" stroke="#333" stroke-width="6"/>
  
  <!-- Hair -->
  <path d="M 88 80 Q 100 70, 112 80 Q 118 85, 112 90 Q 100 85, 88 90 Z" fill="none" stroke="#333" stroke-width="4"/>
  
  <!-- Stretch arrow -->
  <path d="M 135 90 Q 150 80, 165 95" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <polygon points="162,92 170,95 162,98" fill="#10b981"/>
</svg>
