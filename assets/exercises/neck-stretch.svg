<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .person { fill: #8d60f5; }
    .accent { fill: #a27bf7; }
    .arrow { fill: none; stroke: #10b981; stroke-width: 3; }
  </style>
  
  <!-- Head -->
  ircle cx="100" cy="50" r="20" class="person"/>
  
  <!-- Neck (tilted) -->
  <path d="M 100 70 Q 95 80, 90 90" class="person"/>
  
  <!-- Body -->
  <rect x="70" y="90" width="40" height="50" rx="8" class="person"/>
  
  <!-- Arms -->
  <rect x="50" y="95" width="15" height="40" rx="6" class="accent"/>
  <rect x="115" y="95" width="15" height="40" rx="6" class="accent"/>
  
  <!-- Hand on head -->
  <ellipse cx="120" cy="55" rx="8" ry="12" class="accent"/>
  
  <!-- Arrow showing direction -->
  <path d="M 130 60 Q 135 55, 140 50" class="arrow"/>
  <path d="M 138 54 L 140 50 L 136 48" class="arrow"/>
  
  <!-- Chair -->
  <rect x="55" y="140" width="70" height="8" rx="4" fill="#e0e0e0"/>
</svg>
