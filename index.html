<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LeanTil Dashboard ML - Posture Monitoring</title>
    <meta name="description" content="Real-time ML posture monitoring dashboard for LeanTil smart chair">
    <style>
        /* Base Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-bg: #0a0a0a;
            --color-card: #1a1a1a;
            --color-border: #2a2a2a;
            --color-text: #ffffff;
            --color-text-muted: #9ca3af;
            --color-accent: #8d60f5;
            --color-accent-light: #a27bf7;
            --color-yellow: #fbbf24;
            --color-gray: #666;
            --color-green: #10b981;
            font-size: 16px;
        }

        [data-theme="light"] {
            --color-bg: #f5f5f5;
            --color-card: #ffffff;
            --color-border: #e0e0e0;
            --color-text: #1a1a1a;
            --color-text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .logo-img { height: 80px; width: auto; max-width: 250px; object-fit: contain; display: block; }
        .header-controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.125rem; transition: all 0.2s; }
        .theme-toggle:hover { border-color: var(--color-accent); transform: scale(1.05); }
        .card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 1.5rem; padding: 1.75rem; margin-bottom: 1.5rem; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card h3 { font-size: 1.25rem; font-weight: 300; margin-bottom: 1rem; }
        .status-display { display: flex; justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap; }
        .status-text { font-size: 5rem; font-weight: 300; letter-spacing: 0.08em; margin-bottom: 0.75rem; }
        .status-label { color: var(--color-text-muted); font-size: 1.125rem; text-transform: uppercase; letter-spacing: 0.2em; }
        .status-correct { color: var(--color-accent); }
        .status-away { color: var(--color-text-muted); }
        .status-warning { color: var(--color-yellow); }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(var(--color-accent) var(--score-percent, 0deg), var(--color-card) 0deg); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .score-inner { width: 110px; height: 110px; border-radius: 50%; background: var(--color-card); display: flex; align-items: center; justify-content: center; font-size: 2.25rem; font-weight: 300; }
        .btn { padding: 0.875rem 1.75rem; border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text); border-radius: 0.75rem; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; font-weight: 500; }
        .btn:hover { background: var(--color-border); transform: scale(1.02); }
        .btn-primary { background: var(--color-accent); color: #ffffff; border-color: var(--color-accent); }
        .btn-primary:hover { background: var(--color-accent-light); }
        .status-info { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 2rem; font-size: 0.875rem; }
        .status-dot { width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--color-accent); animation: pulse 2s infinite; }
        .status-dot.disconnected { background: var(--color-gray); animation: none; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; }
        .metric-card { text-align: center; padding: 1.25rem; background: rgba(26, 26, 26, 0.5); border-radius: 1rem; border: 1px solid var(--color-border); }
        [data-theme="light"] .metric-card { background: rgba(0, 0, 0, 0.03); }
        .metric-value { font-size: 2.5rem; font-weight: 200; color: var(--color-accent); margin-bottom: 0.5rem; }
        .metric-label { color: var(--color-text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .posture-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin: 1rem auto; width: fit-content; }
        .posture-cell { width: 5.5rem; height: 5.5rem; border-radius: 1.25rem; border: 3px solid var(--color-border); background: rgba(107, 114, 128, 0.3); transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.875rem; font-weight: 600; color: var(--color-text-muted); }
        .posture-cell.active { background: var(--color-accent); border-color: var(--color-accent); box-shadow: 0 0 30px rgba(141, 96, 245, 0.5); transform: scale(1.08); color: #ffffff; }
        .posture-cell .sensor-name { font-size: 0.75rem; margin-bottom: 0.25rem; opacity: 0.9; }
        .posture-cell .weight-percent { font-size: 1.5rem; font-weight: 500; }
        .test-mode { position: fixed; top: 1rem; right: 1rem; background: var(--color-yellow); color: #000; padding: 0.5rem 1rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 500; z-index: 1000; display: flex; align-items: center; gap: 0.5rem; }
        .hidden { display: none !important; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.1); } }

        @media (max-width: 768px) {
            :root { font-size: 14px; }
            .container { padding: 1rem; }
            .status-text { font-size: 2.75rem; }
            .card { padding: 1.25rem; }
            .posture-cell { width: 4.5rem; height: 4.5rem; }
            .logo-img { height: 50px; max-width: 180px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-controls { width: 100%; justify-content: space-between; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="testModeToggle" class="test-mode hidden">
        🧪 DEMO MODE 
        <button id="toggleTestMode" style="background: none; border: none; color: inherit; cursor: pointer; font-weight: 600;">OFF</button>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="text-align: center; max-width: 500px;">
            <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
                <button id="themeToggleLogin" class="theme-toggle" title="Toggle Theme">🌙</button>
            </div>

            <img id="loginLogo" src="leantil-logo2.png" alt="LeanTil" class="logo-img" style="margin-bottom: 2rem;">
            
            <div class="status-dot disconnected" style="margin: 0 auto 2rem;"></div>
            
            <p style="color: var(--color-text-muted); margin-bottom: 3rem; font-size: 1.25rem;">🪑 Posture Monitoring</p>

            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <button id="connectBtn" class="btn btn-primary">🔌 Connect to API</button>
                <button id="testModeBtn" class="btn">🧪 Demo Mode</button>
            </div>

            <p id="errorMessage" style="color: #ef4444; margin-top: 1.5rem; display: none;"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container hidden">
        
        <div class="header">
            <img id="dashboardLogo" src="leantil-logo2.png" alt="LeanTil" class="logo-img">
            
            <div class="header-controls">
                <div class="status-info">
                    <span id="statusDot" class="status-dot"></span>
                    <span id="connectionText">Connected</span>
                </div>
                <button id="themeToggle" class="theme-toggle" title="Toggle Theme">🌙</button>
                <button id="disconnectBtn" class="btn">Disconnect</button>
            </div>
        </div>

        <div class="card">
            <div class="status-display">
                <div style="flex: 1;">
                    <div id="statusText" class="status-text status-correct">BALANCED</div>
                    <div class="status-label">Right Now</div>
                </div>
                <div style="text-align: center;">
                    <div class="score-circle" id="scoreCircle" style="--score-percent: 306deg;">
                        <div class="score-inner"><span id="scoreValue">85</span>%</div>
                    </div>
                    <h3 style="font-weight: 300; margin-top: 1.25rem; font-size: 1.75rem;">Overall Score</h3>
                    <p class="status-label">Your posture wellness</p>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>🗺️ Weight Distribution</h3>
                <div class="posture-grid">
                    <div class="posture-cell" id="cell-0">
                        <div class="sensor-name">FRONT</div>
                        <div class="weight-percent" id="weight-0">25%</div>
                    </div>
                    <div class="posture-cell" id="cell-1">
                        <div class="sensor-name">FRONT</div>
                        <div class="weight-percent" id="weight-1">25%</div>
                    </div>
                    <div class="posture-cell" id="cell-2">
                        <div class="sensor-name">BACK</div>
                        <div class="weight-percent" id="weight-2">25%</div>
                    </div>
                    <div class="posture-cell" id="cell-3">
                        <div class="sensor-name">BACK</div>
                        <div class="weight-percent" id="weight-3">25%</div>
                    </div>
                </div>
                <div style="color: var(--color-text-muted); font-size: 0.875rem; margin-top: 0.75rem; text-align: center; font-style: italic;">Brighter areas show where you're putting more weight</div>
            </div>

            <div class="card">
                <h3>📊 Session Summary</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.25rem; margin-top: 0.5rem;">
                    <div class="metric-card">
                        <div class="metric-value" id="sessionTime">0</div>
                        <div class="metric-label">Minutes</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="correctPercent">0%</div>
                        <div class="metric-label">Good Posture</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="stabilityScore">0%</div>
                        <div class="metric-label">Stability</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // API CONFIGURATION
        const API_CONFIG = {
            BASE_URL: 'https://api-leantil.duckdns.org',
            TOKEN: 'LeanTil',
            USERNAME: 'mario',
            POLL_INTERVAL: 2000
        };

        // GLOBAL STATE
        let isTestMode = false;
        let pollingInterval = null;
        let isConnected = false;
        let dataHistory = [];
        let sessionStartTime = Date.now();
        let correctCount = 0;
        let totalCount = 0;
        let currentTheme = 'dark';
        let consecutiveErrors = 0;
        const MAX_ERRORS = 5;

        // POSTURE MAPPING
        const postureMap = {
            'CORRETTA': { display: 'BALANCED', type: 'correct' },
            'INCLINATO_AVANTI': { display: 'LEANING FORWARD', type: 'warning' },
            'INCLINATO_INDIETRO': { display: 'LEANING BACK', type: 'warning' },
            'INCLINATO_SINISTRA': { display: 'LEANING LEFT', type: 'warning' },
            'INCLINATO_DESTRA': { display: 'LEANING RIGHT', type: 'warning' },
            'SLOUCH': { display: 'SLOUCH', type: 'warning' },
            'ASSENTE': { display: 'AWAY', type: 'away' },
            'CORRECT': { display: 'BALANCED', type: 'correct' },
            'AWAY': { display: 'AWAY', type: 'away' }
        };

        const testPostures = [
            { name: 'CORRETTA', weights: [1200, 1250, 1180, 1220] },
            { name: 'INCLINATO_INDIETRO', weights: [800, 850, 1450, 1480] },
            { name: 'INCLINATO_AVANTI', weights: [1400, 1420, 950, 980] },
            { name: 'INCLINATO_DESTRA', weights: [1100, 1350, 1150, 1400] },
            { name: 'INCLINATO_SINISTRA', weights: [1350, 1100, 1400, 1150] },
            { name: 'ASSENTE', weights: [0, 0, 0, 0] }
        ];

        // DOM ELEMENTS
        const elements = {
            loginScreen: document.getElementById('loginScreen'),
            dashboard: document.getElementById('dashboard'),
            connectBtn: document.getElementById('connectBtn'),
            testModeBtn: document.getElementById('testModeBtn'),
            disconnectBtn: document.getElementById('disconnectBtn'),
            testModeToggle: document.getElementById('testModeToggle'),
            toggleTestMode: document.getElementById('toggleTestMode'),
            statusText: document.getElementById('statusText'),
            scoreValue: document.getElementById('scoreValue'),
            scoreCircle: document.getElementById('scoreCircle'),
            connectionText: document.getElementById('connectionText'),
            errorMessage: document.getElementById('errorMessage'),
            sessionTime: document.getElementById('sessionTime'),
            correctPercent: document.getElementById('correctPercent'),
            stabilityScore: document.getElementById('stabilityScore'),
            themeToggle: document.getElementById('themeToggle'),
            themeToggleLogin: document.getElementById('themeToggleLogin'),
            statusDot: document.getElementById('statusDot'),
            loginLogo: document.getElementById('loginLogo'),
            dashboardLogo: document.getElementById('dashboardLogo')
        };

        const weightElements = [
            document.getElementById('weight-0'),
            document.getElementById('weight-1'),
            document.getElementById('weight-2'),
            document.getElementById('weight-3')
        ];

        const postureCells = ['cell-0', 'cell-1', 'cell-2', 'cell-3'];

        // THEME MANAGEMENT
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            const logoSrc = currentTheme === 'dark' ? 'leantil-logo2.png' : 'leantil-logo.png';
            elements.loginLogo.src = logoSrc;
            elements.dashboardLogo.src = logoSrc;
            const icon = currentTheme === 'dark' ? '🌙' : '☀️';
            elements.themeToggle.textContent = icon;
            elements.themeToggleLogin.textContent = icon;
            localStorage.setItem('theme', currentTheme);
        }

        function loadThemePreference() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') toggleTheme();
        }

        // INIT
        window.addEventListener('DOMContentLoaded', () => {
            initEventListeners();
            updateConnectionStatus();
            loadThemePreference();
        });

        function initEventListeners() {
            elements.connectBtn.onclick = connectToAPI;
            elements.testModeBtn.onclick = toggleTestModeFunc;
            elements.toggleTestMode.onclick = toggleTestModeFunc;
            elements.disconnectBtn.onclick = disconnectDevice;
            elements.themeToggle.onclick = toggleTheme;
            elements.themeToggleLogin.onclick = toggleTheme;
        }

        // API CONNECTION
        async function connectToAPI() {
            try {
                console.log('Testing API at:', API_CONFIG.BASE_URL);
                showStatusMessage('Connecting to API...');
                
                const response = await fetch(API_CONFIG.BASE_URL, {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.service === 'LeanTil API') {
                    console.log('✅ API Connected');
                    isConnected = true;
                    updateConnectionStatus();
                    showDashboard();
                    startAPIPolling();
                } else {
                    throw new Error('Invalid API response');
                }
            } catch (error) {
                console.error('API Connection Error:', error);
                if (error.message.includes('Failed to fetch')) {
                    showError('Cannot connect to API. Check:\n1. API is running on Raspberry\n2. HTTPS configuration\n3. Try Demo Mode instead');
                } else {
                    showError(`Cannot connect: ${error.message}`);
                }
            }
        }

        function startAPIPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            fetchLatestMLData();
            pollingInterval = setInterval(fetchLatestMLData, API_CONFIG.POLL_INTERVAL);
            console.log(`✅ API Polling started (${API_CONFIG.POLL_INTERVAL}ms interval)`);
        }

        async function fetchLatestMLData() {
            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/ultimo_ml?utente=${encodeURIComponent(API_CONFIG.USERNAME)}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': API_CONFIG.TOKEN,
                        'Content-Type': 'application/json'
                    },
                    signal: AbortSignal.timeout(5000)
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const apiData = await response.json();
                
                if (!apiData || !apiData.postura) throw new Error('No data available');
                
                consecutiveErrors = 0;

                const data = {
                    postureName: apiData.postura,
                    lc0: (apiData.sensor0 || 0) / 1000,
                    lc1: (apiData.sensor1 || 0) / 1000,
                    lc2: (apiData.sensor2 || 0) / 1000,
                    lc3: (apiData.sensor3 || 0) / 1000
                };

                parseAndUpdateData(data);

            } catch (error) {
                console.error('API Fetch Error:', error);
                consecutiveErrors++;
                if (consecutiveErrors >= MAX_ERRORS) {
                    showError('Connection lost - check device and API');
                }
            }
        }

        function stopAPIPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
                console.log('API Polling stopped');
            }
        }

        // TEST MODE
        let testInterval;

        function toggleTestModeFunc() {
            isTestMode = !isTestMode;
            elements.testModeToggle.classList.toggle('hidden', !isTestMode);
            elements.toggleTestMode.textContent = isTestMode ? 'ON' : 'OFF';

            if (isTestMode && !isConnected) {
                updateConnectionStatus();
                showDashboard();
                startTestData();
            } else if (!isTestMode && !isConnected) {
                stopTestMode();
                updateConnectionStatus();
                showLogin();
            }
        }

        function startTestData() {
            testInterval = setInterval(() => {
                const posture = testPostures[Math.floor(Math.random() * testPostures.length)];
                const data = {
                    postureName: posture.name,
                    lc0: posture.weights[0],
                    lc1: posture.weights[1],
                    lc2: posture.weights[2],
                    lc3: posture.weights[3]
                };
                parseAndUpdateData(data);
            }, 2000);
        }

        function stopTestMode() {
            if (testInterval) {
                clearInterval(testInterval);
                testInterval = null;
            }
        }

        // DISCONNECT
        async function disconnectDevice() {
            stopTestMode();
            stopAPIPolling();
            isConnected = false;
            updateConnectionStatus();
            showLogin();
            resetData();
        }

        // DATA PARSING
        function parseAndUpdateData(data) {
            const totalWeight = data.lc0 + data.lc1 + data.lc2 + data.lc3;
            
            data.percentages = [
                totalWeight > 0 ? (data.lc0 / totalWeight) * 100 : 25,
                totalWeight > 0 ? (data.lc1 / totalWeight) * 100 : 25,
                totalWeight > 0 ? (data.lc2 / totalWeight) * 100 : 25,
                totalWeight > 0 ? (data.lc3 / totalWeight) * 100 : 25
            ];

            dataHistory.push({ ...data, timestamp: Date.now(), percentages: data.percentages });
            if (dataHistory.length > 500) dataHistory.shift();

            totalCount++;

            const mapped = postureMap[data.postureName] || { display: 'UNKNOWN', type: 'warning' };
            const isCorrect = mapped.type === 'correct';
            if (isCorrect) correctCount++;

            updateAllUI(data, mapped);
        }

        // UI UPDATE
        function updateAllUI(data, posture) {
            elements.statusText.textContent = posture.display;
            elements.statusText.className = `status-text status-${posture.type}`;

            const score = totalCount > 0 ? Math.max(0, Math.min(100, Math.round((correctCount / totalCount) * 100) - 5)) : 85;
            
            elements.scoreValue.textContent = score;
            elements.scoreCircle.style.setProperty('--score-percent', `${score * 3.6}deg`);
            elements.correctPercent.textContent = `${score}%`;
            elements.stabilityScore.textContent = `${Math.round(score * 0.9 + 10)}%`;

            const minutes = Math.floor((Date.now() - sessionStartTime) / 60000);
            elements.sessionTime.textContent = minutes;

            updatePostureMap(data);
        }

        function updatePostureMap(data) {
            const activeCells = getActiveCells(data.postureName);
            
            postureCells.forEach((cellId, i) => {
                const cell = document.getElementById(cellId);
                const weightEl = weightElements[i];
                
                if (cell) {
                    cell.classList.toggle('active', activeCells.includes(i));
                }
                
                if (weightEl) {
                    weightEl.textContent = `${Math.round(data.percentages[i])}%`;
                }
            });
        }

        function getActiveCells(name) {
            if (name === 'CORRETTA' || name === 'CORRECT') return [0, 1, 2, 3];
            if (name.includes('AVANTI') || name.includes('FORWARD')) return [0, 1];
            if (name.includes('INDIETRO') || name.includes('BACK')) return [2, 3];
            if (name.includes('SINISTRA') || name.includes('LEFT')) return [0, 2];
            if (name.includes('DESTRA') || name.includes('RIGHT')) return [1, 3];
            return [];
        }

        function showDashboard() {
            elements.loginScreen.classList.add('hidden');
            elements.dashboard.classList.remove('hidden');
        }

        function showLogin() {
            elements.dashboard.classList.add('hidden');
            elements.loginScreen.classList.remove('hidden');
        }

        function showError(msg) {
            elements.errorMessage.textContent = msg;
            elements.errorMessage.style.display = 'block';
            setTimeout(() => {
                elements.errorMessage.style.display = 'none';
            }, 8000);
        }

        function updateConnectionStatus() {
            if (isConnected || isTestMode) {
                elements.connectionText.textContent = 'Connected';
                elements.statusDot.classList.remove('disconnected');
            } else {
                elements.connectionText.textContent = 'Disconnected';
                elements.statusDot.classList.add('disconnected');
            }
        }

        function showStatusMessage(msg) {
            console.log('📢', msg);
        }

        function resetData() {
            dataHistory = [];
            sessionStartTime = Date.now();
            correctCount = 0;
            totalCount = 0;
        }
    </script>

</body>
</html>
